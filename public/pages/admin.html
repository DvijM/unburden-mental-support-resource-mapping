<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Unburden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body data-page="admin" class="bg-surface text-ink">

  <!-- Full nav (admin uses the main nav with an admin badge) -->

  <header class="bg-white border-b border-surface-mid sticky top-0 z-40">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between" aria-label="Primary">
      <a href="/" class="flex items-center gap-2" aria-label="Unburden home">
        <span class="w-6 h-6 rounded bg-primary text-white grid place-items-center text-[12px] font-serif font-bold">U</span>
        <span class="font-display font-bold text-[17px]">Unburden</span>
      </a>
      <div class="flex items-center gap-4 text-[13px]">
        <span id="admin-greeting" class="hidden sm:flex items-center gap-2 text-[11px] tracking-[.12em] uppercase text-ink-soft">Admin</span>
        <a href="/" class="text-ink-soft hover:text-primary">← Back to site</a>
        <button id="admin-logout" type="button" class="btn-secondary px-3.5 py-1.5 text-[11px] tracking-[.1em] uppercase">Log Out</button>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div class="flex items-baseline justify-between mb-6">
      <h1 class="font-display font-bold text-[26px]">Admin Dashboard</h1>
      <p class="text-[11px] text-ink-mute">Viewing user data · <span id="last-updated"></span></p>
    </div>

    <!-- Stats row -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-editorial shadow-card p-4">
        <p class="text-[9.5px] tracking-[.1em] uppercase text-ink-mute">Total Users</p>
        <p class="font-display font-bold text-[28px] text-ink mt-1" id="stat-total">—</p>
      </div>
      <div class="bg-white rounded-editorial shadow-card p-4">
        <p class="text-[9.5px] tracking-[.1em] uppercase text-ink-mute">Screenings Completed</p>
        <p class="font-display font-bold text-[28px] text-ink mt-1" id="stat-scores">—</p>
      </div>
      <div class="bg-white rounded-editorial shadow-card p-4">
        <p class="text-[9.5px] tracking-[.1em] uppercase text-ink-mute">Average Score</p>
        <p class="font-display font-bold text-[28px] text-primary mt-1"><span id="stat-avg">—</span><span class="text-[14px] text-ink-mute"> / 27</span></p>
      </div>
    </div>

    <!-- User table -->
    <section class="bg-white rounded-editorial shadow-card overflow-hidden" aria-labelledby="users-title">
      <div class="p-5 border-b border-surface-mid flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 id="users-title" class="font-display font-bold text-[16px]">Registered Users</h2>
          <p id="user-count" class="text-[11px] text-ink-mute mt-0.5"></p>
        </div>
        <div class="relative">
          <input type="search" id="user-search" placeholder="Search by name, email, or phone…"
            class="w-full sm:w-72 bg-surface-mid rounded px-3 py-2 text-[12px] border border-transparent focus:border-primary"
            aria-label="Search users" />
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="admin-table w-full">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Phone</th>
              <th scope="col" class="text-center">Screening Score</th>
              <th scope="col">Registered</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr><td colspan="5" class="text-center py-6 text-ink-mute">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Recent signups -->
    <section class="mt-6 bg-surface-low rounded-editorial p-5" aria-labelledby="recent-title">
      <h2 id="recent-title" class="text-[10px] tracking-[.14em] uppercase text-ink-soft font-medium">Recent Signups</h2>
      <ul id="recent-list" class="mt-3 space-y-2.5">
        <li class="text-ink-mute text-[11px]">Loading…</li>
      </ul>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="/js/main.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>

</html>
